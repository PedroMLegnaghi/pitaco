[project]
name = "pitaco"
version = "0.1.0"
description = "Distilling aspect-based sentiment analysis for Brazilian Portuguese reviews into a small LLM"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pedro Muller Legnaghi" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaggle>=2.2.5",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.3",
]

[project.scripts]
pitaco = "pitaco.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
app = [
    "gradio>=6.31.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
