# Local smoke test of the main student (RTX 3050, 6 GB): same model + QLoRA, 30 steps, no W&B.
extends: ../base.yaml

base_model: Qwen/Qwen3-4B-Instruct-2507
loader: language
load_in_4bit: true
max_seq_length: 512
chat_template_kwargs: {}
wandb: {mode: disabled}
train:
  train_set: n500
  batch_size: 2
  grad_accum: 1
  eval_steps: 30
  max_steps: 30
output_dir: outputs/smoke-qwen3
system_name: smoke-qwen3-4b
generation: {throughput_batch_size: 2}
